name: Sync and deploy Inter-Knot
on:
  push:
  pull_request:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      build_only:
        description: Deploy the existing archive without contacting the news source
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: inter-knot-${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.archive.outputs.changed }}
      base: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test source and build behavior
        run: |
          python3 -m unittest discover -s tests -v
          node --check static/app.js
          node --expose-internals tests/client.cjs
      - name: Synchronize official announcements
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.build_only)
        shell: bash
        run: |
          set -o pipefail
          python3 -m scripts.sync | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build and check static site
        run: |
          python3 -m scripts.build
          python3 -m scripts.verify
      - name: Detect archive changes
        id: archive
        shell: bash
        run: |
          if git diff --quiet -- data/announcements.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload changed archive
        if: github.event_name != 'pull_request' && steps.archive.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inter-knot-archive
          path: data/announcements.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Explain why Pages publishing is skipped
        if: github.event_name != 'pull_request' && github.event.repository.has_pages != true
        run: |
          echo 'GitHub Pages is disabled. The site artifact is available in this run. Enable Pages and select GitHub Actions in Settings → Pages, then dispatch the workflow again.' >> "$GITHUB_STEP_SUMMARY"

  persist:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: inter-knot-archive
          path: ${{ runner.temp }}/inter-knot-archive
      - name: Commit and push validated archive
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARCHIVE_DIR: ${{ runner.temp }}/inter-knot-archive
        run: |
          cp -- "$ARCHIVE_DIR/announcements.json" data/announcements.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/announcements.json
          git diff --cached --quiet && exit 0
          git commit -m "Update official announcement archive"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  deploy:
    needs: [build, persist]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && github.event.repository.has_pages == true && needs.build.result == 'success' && (needs.persist.result == 'success' || (needs.persist.result == 'skipped' && needs.build.outputs.changed == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
