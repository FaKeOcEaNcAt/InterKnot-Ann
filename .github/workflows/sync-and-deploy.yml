name: Sync and deploy Inter-Knot
on:
  push:
  pull_request:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      build_only:
        description: Deploy the existing archive without contacting the news source
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: inter-knot-${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.archive.outputs.changed }}
      base: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: checkout
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test source and build behavior
        run: |
          python3 -m unittest discover -s tests -v
          node --check static/app.js
          node --expose-internals tests/client.cjs
      - name: Synchronize official announcements
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.build_only)
        shell: bash
        run: |
          set -o pipefail
          python3 -m scripts.sync | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build and check static site
        run: |
          python3 -m scripts.build
          python3 -m scripts.verify
      - name: Detect archive changes
        id: archive
        shell: bash
        run: |
          if git diff --quiet -- data/announcements.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload changed archive
        if: github.event_name != 'pull_request' && steps.archive.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inter-knot-archive
          path: data/announcements.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  persist:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inter-knot-archive
          path: ${{ runner.temp }}/inter-knot-archive
      - name: Commit and push validated archive
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARCHIVE_DIR: ${{ runner.temp }}/inter-knot-archive
        run: |
          cp -- "$ARCHIVE_DIR/announcements.json" data/announcements.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/announcements.json
          git diff --cached --quiet && exit 0
          git commit -m "Update official announcement archive"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  deploy:
    needs: [build, persist]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.persist.result == 'success' || (needs.persist.result == 'skipped' && needs.build.outputs.changed == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
